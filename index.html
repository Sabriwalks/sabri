<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1923" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sabri" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <title>Sabri — AI Audio Tour Guide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button id="settings-btn" class="settings-btn" aria-label="Open settings">⚙️</button>
      <div class="logo">Sabri</div>
    </header>

    <section id="status-card" class="location-section">
      <h1 id="location-name" class="location-name">Nachlaot, Jerusalem</h1>

      <div id="pulse" class="pulse" aria-hidden="true">
        <span class="pulse-ring"></span>
        <span class="pulse-ring pulse-ring--delay"></span>
        <span class="pulse-dot"></span>
      </div>

      <p id="status-text" class="status-text">Tap start to begin your tour.</p>
    </section>

    <footer class="app-footer">
      <p class="tap-hint">Tap to talk</p>
      <button id="start-btn" class="start-btn">Start Tour</button>
      <button id="install-btn" class="install-btn hidden">Add to Home Screen</button>
    </footer>
  </div>

  <!-- Collapsed by default: only a peek handle with a "tap to read" hint
       shows while walking. Tap or swipe up to reveal the full narration. -->
  <section id="player-card" class="player-card hidden">
    <button id="drawer-handle" class="drawer-handle" aria-label="Show story details">
      <span class="drawer-handle-bar" aria-hidden="true"></span>
      <span class="drawer-handle-hint">Tap to read</span>
    </button>

    <div class="drawer-content">
      <button id="drawer-close" class="drawer-close" aria-label="Hide story details">✕</button>

      <div id="place-photo" class="place-photo" aria-hidden="true"></div>

      <p class="now-playing">Now Playing</p>
      <h2 id="place-name" class="story-title">—</h2>
      <p id="place-description" class="story-description">—</p>

      <div class="speed-controls" role="group" aria-label="Narration speed">
        <button class="speed-btn" data-speed="0.75">0.75x</button>
        <button class="speed-btn is-active" data-speed="1">1.0x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
      </div>

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>

      <div class="controls">
        <button id="play-btn" class="control-btn" aria-label="Play">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="pause-btn" class="control-btn hidden" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Tap-to-talk mic button, floats bottom-right above the drawer/footer. -->
  <button id="mic-btn" class="mic-btn" aria-label="Ask Sabri a question">🎤</button>
  <p id="ask-subtitle" class="ask-subtitle hidden"></p>

  <!-- Settings drawer, slides in from the right. -->
  <div id="settings-overlay" class="settings-overlay hidden"></div>
  <aside id="settings-drawer" class="settings-drawer" aria-hidden="true">
    <div class="settings-drawer-header">
      <h2>Settings</h2>
      <button id="settings-close" class="drawer-close" aria-label="Close settings">✕</button>
    </div>

    <div class="settings-drawer-body">
      <section class="settings-section">
        <h3 class="settings-section-title">Guide Voice</h3>
        <div class="voice-options">
          <button class="voice-card is-active" data-voice="onyx">
            <span class="voice-card-name">Onyx</span>
            <span class="voice-card-desc">Deep &amp; Warm</span>
          </button>
          <button class="voice-card" data-voice="nova">
            <span class="voice-card-name">Nova</span>
            <span class="voice-card-desc">Clear &amp; Bright</span>
          </button>
          <button class="voice-card" data-voice="shimmer">
            <span class="voice-card-name">Shimmer</span>
            <span class="voice-card-desc">Soft &amp; Gentle</span>
          </button>
        </div>
      </section>

      <section class="settings-section">
        <h3 class="settings-section-title">Tour Depth</h3>
        <div class="depth-options">
          <button class="depth-pill" data-depth="surface">
            <span class="depth-pill-name">Surface</span>
            <span class="depth-pill-desc">Quick highlights</span>
          </button>
          <button class="depth-pill is-active" data-depth="standard">
            <span class="depth-pill-name">Standard</span>
            <span class="depth-pill-desc">Balanced</span>
          </button>
          <button class="depth-pill" data-depth="deep">
            <span class="depth-pill-name">Deep</span>
            <span class="depth-pill-desc">Full stories</span>
          </button>
        </div>
      </section>

      <section class="settings-section">
        <h3 class="settings-section-title">Tour Language</h3>
        <select id="language-select" class="language-select">
          <option value="en">English</option>
          <option value="he">Hebrew</option>
          <option value="ar">Arabic</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="ru">Russian</option>
        </select>
      </section>

      <section class="settings-about">
        <p>Sabri v1.0 — Your personal AI tour guide. Built with love in Jerusalem.</p>
      </section>
    </div>
  </aside>

  <!-- Real playback element — required for iOS Safari to keep audio going
       with the screen locked / app backgrounded, and for Media Session
       (lock-screen title/artwork + AirPods play/pause) to attach to it. -->
  <audio id="audio-player" playsinline webkit-playsinline style="display:none"></audio>

  <script src="app.js"></script>
</body>
</html>
